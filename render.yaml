services:
  - type: web
    name: lol1kekcheburek
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromDatabase:
          name: km20-license-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
databases:
  - name: km20-license-db
    plan: basic-256mb
    databaseName: km20license
    user: km20license
